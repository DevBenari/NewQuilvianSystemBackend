name: Validate AgentCodexBackend

on:
  push:
    branches:
      - AgentCodexBackend

permissions:
  contents: read

concurrency:
  group: quilvian-agent-codex-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Restore and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: QuilvianSystemBackend.csproj

      - name: Read authoritative version and generate build metadata
        shell: bash
        run: |
          BACKEND_VERSION="$(jq -er '.backendVersion' version.json)"
          BUILD_VERSION="${BACKEND_VERSION}-dev.${GITHUB_RUN_NUMBER}"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "APP_BUILD_VERSION=${BUILD_VERSION}" >> "${GITHUB_ENV}"
          echo "APP_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "${GITHUB_ENV}"
          echo "APP_COMMIT_SHA=${GITHUB_SHA}" >> "${GITHUB_ENV}"
          echo "APP_BRANCH=${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"
          echo "APP_BUILD_DATE=${BUILD_DATE}" >> "${GITHUB_ENV}"

      - name: Restore
        run: dotnet restore ./QuilvianSystemBackend.sln

      - name: Build
        run: dotnet build ./QuilvianSystemBackend.sln --configuration Release --no-restore

      - name: Report build version
        shell: bash
        run: echo "Validated ${APP_BUILD_VERSION} (${APP_COMMIT_SHA})"

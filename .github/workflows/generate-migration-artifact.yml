name: Generate EF Migration Artifact

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character Backend commit SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: migration-artifact-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Migration SQL
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Validate target SHA
        shell: bash
        run: |
          set -euo pipefail

          TARGET_SHA="${{ inputs.target_sha }}"

          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::target_sha must be a full 40-character Git SHA."
            exit 1
          fi

      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Verify checked-out identity
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_SHA="$(printf '%s' '${{ inputs.target_sha }}' | tr 'A-F' 'a-f')"
          ACTUAL_SHA="$(git rev-parse HEAD)"

          echo "Expected SHA : $EXPECTED_SHA"
          echo "Actual SHA   : $ACTUAL_SHA"

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked-out SHA does not match requested SHA."
            exit 1
          fi

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Show SDK
        shell: bash
        run: |
          dotnet --version
          dotnet --info | head -n 30

      - name: Restore
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore QuilvianSystemBackend.csproj --verbosity minimal

      - name: Install EF Core CLI
        shell: bash
        run: |
          set -euo pipefail

          dotnet tool install \
            --tool-path ./.tools \
            dotnet-ef \
            --version 9.0.18

          ./.tools/dotnet-ef --version

      - name: Build migration metadata
        shell: bash
        run: |
          set -euo pipefail

          dotnet build \
            QuilvianSystemBackend.csproj \
            -c Release \
            --no-restore \
            /p:SkipMigrationMetadata=false \
            /p:UseSharedCompilation=false \
            --verbosity minimal

      - name: Generate idempotent migration SQL
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Staging

          ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=1;Database=DO_NOT_CONNECT;Username=none;Password=none"
          ConnectionStrings__Redis: "127.0.0.1:1"

          Jwt__Key: "MigrationArtifactOnly_DummyKey_1234567890"
          Jwt__Issuer: "QuilvianMigrationArtifact"
          Jwt__Audience: "QuilvianMigrationArtifact"

          SeedDefaultData__Enabled: "false"

        run: |
          set -euo pipefail

          mkdir -p migration-artifact

          ARTIFACT="migration-artifact/Quilvian_f935_205_migrations.sql"

          ./.tools/dotnet-ef migrations script \
            0 \
            20260918085707_AddLabMicrobiologyMasterData \
            --idempotent \
            --context ApplicationDbContext \
            --project QuilvianSystemBackend.csproj \
            --startup-project QuilvianSystemBackend.csproj \
            --configuration Release \
            --no-build \
            --output "$ARTIFACT"

          test -s "$ARTIFACT"

      - name: Verify migration artifact
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT="migration-artifact/Quilvian_f935_205_migrations.sql"

          grep -q \
            '20260914084655_AddLabSpecimenType' \
            "$ARTIFACT"

          grep -q \
            '20260918085707_AddLabMicrobiologyMasterData' \
            "$ARTIFACT"

          HISTORY_INSERTS="$(
            grep -c \
              'INSERT INTO "__EFMigrationsHistory"' \
              "$ARTIFACT" || true
          )"

          echo "Migration history statements: $HISTORY_INSERTS"

          if [ "$HISTORY_INSERTS" -ne 205 ]; then
            echo "::error::Expected 205 migration history statements."
            exit 1
          fi

      - name: Audit structural operations
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT="migration-artifact/Quilvian_f935_205_migrations.sql"

          {
            echo "Structural / destructive operation audit"
            echo "Target SHA: ${{ inputs.target_sha }}"
            echo

            grep -nEi \
              'DROP TABLE|DROP COLUMN|DROP INDEX|ALTER TABLE|ALTER COLUMN|DELETE FROM|TRUNCATE' \
              "$ARTIFACT" \
              || true

          } > migration-artifact/destructive-operations.txt

      - name: Create manifest and SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd migration-artifact

          SHA="$(git -C .. rev-parse HEAD)"

          {
            echo "TargetCommit=$SHA"
            echo "MigrationCount=205"
            echo "LatestMigration=20260918085707_AddLabMicrobiologyMasterData"
            echo "DotNetVersion=$(dotnet --version)"
            echo "EfCoreVersion=9.0.18"
            echo "GeneratedAt=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > migration-manifest.txt

          sha256sum Quilvian_f935_205_migrations.sql > sha256.txt

          cat migration-manifest.txt
          cat sha256.txt

      - name: Upload migration artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-migration-f935-205
          path: |
            migration-artifact/Quilvian_f935_205_migrations.sql
            migration-artifact/migration-manifest.txt
            migration-artifact/sha256.txt
            migration-artifact/destructive-operations.txt
          if-no-files-found: error
          retention-days: 14
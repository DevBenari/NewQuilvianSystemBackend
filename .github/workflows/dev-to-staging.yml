name: DEV to STAGING Promotion

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Full 40-character commit SHA from QuilvianDevDeploy"
        required: true
        type: string

permissions:
  contents: write
  packages: read

concurrency:
  group: backend-staging-promotion
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/devbenari/newquilviansystembackend
  STAGING_VERSION_URL: https://api-sta.quilvian-mmchospital.com/api/v1/system/version
  STAGING_HEALTH_URL: https://api-sta.quilvian-mmchospital.com/health

jobs:
  validate:
    name: Validate DEV Artifact
    runs-on: ubuntu-latest

    outputs:
      target_sha: ${{ steps.target.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate target SHA format
        id: target
        shell: bash
        run: |
          set -euo pipefail

          TARGET_SHA="${{ inputs.target_sha }}"

          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::target_sha must be a full 40-character Git SHA."
            exit 1
          fi

          TARGET_SHA="$(printf '%s' "$TARGET_SHA" | tr 'A-F' 'a-f')"

          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify target belongs to QuilvianDevDeploy
        shell: bash
        run: |
          set -euo pipefail

          TARGET_SHA="${{ steps.target.outputs.sha }}"

          git fetch origin \
            QuilvianDevDeploy \
            QuilvianStaDeploy

          if ! git cat-file -e "${TARGET_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Target SHA does not exist in this repository."
            exit 1
          fi

          if ! git merge-base --is-ancestor \
            "$TARGET_SHA" \
            origin/QuilvianDevDeploy; then

            echo "::error::Target SHA is not part of QuilvianDevDeploy history."
            exit 1
          fi

          echo "Target SHA belongs to QuilvianDevDeploy."

      - name: Prevent staging branch rewind
        shell: bash
        run: |
          set -euo pipefail

          TARGET_SHA="${{ steps.target.outputs.sha }}"

          git fetch origin QuilvianStaDeploy

          CURRENT_STAGING="$(git rev-parse origin/QuilvianStaDeploy)"

          echo "Current staging : $CURRENT_STAGING"
          echo "Target          : $TARGET_SHA"

          if [ "$CURRENT_STAGING" = "$TARGET_SHA" ]; then
            echo "Target is already the current staging revision."
            exit 0
          fi

          if ! git merge-base --is-ancestor \
            "$CURRENT_STAGING" \
            "$TARGET_SHA"; then

            echo "::error::Promotion would rewind or diverge QuilvianStaDeploy."
            exit 1
          fi

          echo "Forward-only staging promotion validated."

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable DEV image exists
        shell: bash
        run: |
          set -euo pipefail

          TARGET_SHA="${{ steps.target.outputs.sha }}"

          docker buildx imagetools inspect \
            "${IMAGE_NAME}:${TARGET_SHA}" \
            > /dev/null

          echo "Image exists: ${IMAGE_NAME}:${TARGET_SHA}"

      - name: Validation summary
        shell: bash
        run: |
          {
            echo "## DEV → STAGING Validation"
            echo ""
            echo "- Target SHA: \`${{ steps.target.outputs.sha }}\`"
            echo "- DEV history validation: PASS"
            echo "- Forward-only validation: PASS"
            echo "- Immutable Docker image: PASS"
          } >> "$GITHUB_STEP_SUMMARY"


  deploy-staging:
    name: Deploy STAGING
    needs:
      - validate

    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          echo "${{ secrets.SSH_KNOWN_HOSTS }}" \
            > ~/.ssh/known_hosts

      - name: Deploy immutable DEV artifact to STAGING
        shell: bash
        run: |
          set -euo pipefail

          TARGET_SHA="${{ needs.validate.outputs.target_sha }}"

          ssh \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "IMAGE_NAME='${IMAGE_NAME}' \
             IMAGE_TAG='${TARGET_SHA}' \
             EXPECTED_COMMIT_SHA='${TARGET_SHA}' \
             bash /opt/QuilvianStagingV2/deploy.sh"

      - name: Verify public STAGING health
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..12}; do
            if curl -fsS \
              "${STAGING_HEALTH_URL}" \
              > /dev/null; then

              echo "Public staging health check PASS."
              exit 0
            fi

            echo "Waiting for public staging ${i}/12..."
            sleep 5
          done

          echo "::error::Public staging health check failed."
          exit 1

      - name: Verify public STAGING identity
        shell: bash
        run: |
          set -euo pipefail

          TARGET_SHA="${{ needs.validate.outputs.target_sha }}"

          RESPONSE="$(
            curl -fsS \
              "${STAGING_VERSION_URL}"
          )"

          ACTUAL_SHA="$(
            printf '%s' "$RESPONSE" \
              | jq -er '.data.commitSha'
          )"

          ACTUAL_ENV="$(
            printf '%s' "$RESPONSE" \
              | jq -er '.data.environment'
          )"

          BUILD_VERSION="$(
            printf '%s' "$RESPONSE" \
              | jq -er '.data.buildVersion'
          )"

          echo "Target SHA    : $TARGET_SHA"
          echo "Runtime SHA   : $ACTUAL_SHA"
          echo "Environment   : $ACTUAL_ENV"
          echo "Build         : $BUILD_VERSION"

          if [ "$ACTUAL_SHA" != "$TARGET_SHA" ]; then
            echo "::error::Public runtime SHA does not match promoted SHA."
            exit 1
          fi

          if [ "$ACTUAL_ENV" != "Staging" ]; then
            echo "::error::Public runtime environment is not Staging."
            exit 1
          fi


  mark-staging:
    name: Update Staging Release Pointer
    needs:
      - validate
      - deploy-staging

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move QuilvianStaDeploy to deployed revision
        shell: bash
        run: |
          set -euo pipefail

          TARGET_SHA="${{ needs.validate.outputs.target_sha }}"

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin \
            QuilvianDevDeploy \
            QuilvianStaDeploy

          CURRENT_STAGING="$(
            git rev-parse \
              origin/QuilvianStaDeploy
          )"

          echo "Current staging : $CURRENT_STAGING"
          echo "Target          : $TARGET_SHA"

          if [ "$CURRENT_STAGING" = "$TARGET_SHA" ]; then
            echo "QuilvianStaDeploy already points to target SHA."
            exit 0
          fi

          if ! git merge-base --is-ancestor \
            "$CURRENT_STAGING" \
            "$TARGET_SHA"; then

            echo "::error::Refusing non-fast-forward staging update."
            exit 1
          fi

          git push \
            origin \
            "${TARGET_SHA}:refs/heads/QuilvianStaDeploy"

      - name: Promotion summary
        shell: bash
        run: |
          {
            echo "## STAGING Promotion PASSED"
            echo ""
            echo "- SHA: \`${{ needs.validate.outputs.target_sha }}\`"
            echo "- Artifact promotion: PASS"
            echo "- Server deployment: PASS"
            echo "- Public health check: PASS"
            echo "- Public identity check: PASS"
            echo "- QuilvianStaDeploy updated: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
name: Integration to DEV Gate

on:
  push:
    branches:
      - QuilvianIntegrationBackend

  workflow_dispatch:

concurrency:
  group: integration-to-dev-gate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration-gate:
    name: Integration Fast Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Show candidate
        shell: bash
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Candidate SHA: $GITHUB_SHA"

      - name: Restore backend project
        run: dotnet restore ./QuilvianSystemBackend.csproj

      - name: Build backend project
        run: >
          dotnet build
          ./QuilvianSystemBackend.csproj
          --configuration Release
          -p:SkipMigrationMetadata=true

      # Gerbang regresi otorisasi. Menggantikan invarian yang dulu dijaga backend
      # test project. BACA-SAJA: tidak menyalakan aplikasi, tidak menyentuh
      # database, tidak memanggil AccessMenuSeeder.
      #
      # Sengaja ditempatkan SESUDAH build backend dan SEBELUM keputusan migration
      # serta promosi ke DEV: kandidat yang gagal di sini tidak boleh dipromosikan.
      # Dipanggil lewat `bash`, bukan `./`, supaya tidak bergantung pada bit
      # executable yang sering hilang saat berkas dibuat di Windows.
      - name: Verify authorization registry
        shell: bash
        run: bash ./tools/authorization-verifier/verify-authorization.sh --configuration Release

      - name: Detect migration changes
        id: migrations
        shell: bash
        run: |
          git fetch origin QuilvianDevDeploy

          MIGRATION_CHANGES="$(
            git diff --name-only \
              origin/QuilvianDevDeploy \
              HEAD \
              -- Migrations/
          )"

          if [ -n "$MIGRATION_CHANGES" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo "Migration changes detected:"
            echo "$MIGRATION_CHANGES"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No migration changes detected."
          fi

      - name: Gate summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Integration Fast Gate PASSED"
            echo ""
            echo "- Candidate: \`${GITHUB_SHA}\`"
            echo "- Backend project build: PASS"
            echo "- Authorization verifier: PASS"
            echo "- Migration changed: ${{ steps.migrations.outputs.changed }}"
            echo ""
            echo "Auto promotion is still disabled during validation."
          } >> "$GITHUB_STEP_SUMMARY"